<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><script>/* Green Bites: connects the page to its own server (replaces Claude's shared database). */
(function () {
  if (window.claude && window.claude.use) return;
  var LS = window.localStorage, ident = null, idP = null;
  function getId() {
    if (ident) return Promise.resolve(ident);
    if (idP) return idP;
    var uid = null, sec = null;
    try { uid = LS.getItem("gb_sid"); sec = LS.getItem("gb_ssec"); } catch (e) {}
    idP = fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ uid: uid, secret: sec }) })
      .then(function (r) { if (!r.ok) throw new Error("session"); return r.json(); })
      .then(function (j) { try { LS.setItem("gb_sid", j.uid); LS.setItem("gb_ssec", j.secret); } catch (e) {} ident = j; return j; })
      .catch(function (e) { idP = null; throw e; });
    return idP;
  }
  function call(method, url, body) {
    return getId().then(function (id) {
      return fetch(url, { method: method, headers: { "content-type": "application/json", "x-uid": id.uid, "x-secret": id.secret }, body: body ? JSON.stringify(body) : undefined })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || r.status); e.status = r.status; throw e; } return j; }); });
    });
  }
  var db = {
    collection: function (p) {
      return {
        onSnapshot: function (cb, err) {
          var stop = false, v = "", t = null;
          function tick() {
            if (stop) return;
            call("GET", "/api/col?path=" + encodeURIComponent(p) + "&v=" + v).then(function (j) {
              if (stop) return;
              if (!j.same) {
                v = String(j.v);
                cb({ docs: (j.docs || []).map(function (d) { return { id: d.id, data: function () { return d.data; } }; }) });
              }
            }).catch(function (e) { if (err && !stop) { try { err(e); } catch (x) {} } })
              .then(function () { if (!stop) t = setTimeout(tick, document.hidden ? 20000 : 5000); });
          }
          tick();
          return function () { stop = true; clearTimeout(t); };
        }
      };
    },
    doc: function (p) {
      return {
        set: function (data) { return call("PUT", "/api/doc", { path: p, data: data }); },
        get: function () { return call("GET", "/api/doc?path=" + encodeURIComponent(p)).then(function (j) { return { exists: !!j.exists, data: function () { return j.data; } }; }); },
        delete: function () { return call("DELETE", "/api/doc?path=" + encodeURIComponent(p)); }
      };
    }
  };
  var user = {
    id: function () { return getId().then(function (i) { return i.uid; }); },
    canEdit: function () { return call("GET", "/api/me").then(function (j) { return !!j.admin; }); }
  };
  window.claude = { use: function (n) { return Promise.resolve(n === "db" ? db : n === "user" ? user : null); } };
  window.gbAdminLogin = function (pw) { return call("POST", "/api/admin/login", { password: pw }); };
  window.gbAdminLogout = function () { return call("POST", "/api/admin/logout").catch(function () {}); };
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Bites</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7EE;--card:#fff;--ink:#14261A;--mut:#5B6E60;--leaf:#1E7A3F;--leaf2:#DDEFD9;--sun:#FFB627;--red:#E8503A;--line:#D9E3D3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A13;--card:#182619;--ink:#EAF3E6;--mut:#9FB3A3;--leaf:#4CC46E;--leaf2:#20402A;--line:#27402D}}
:root[data-theme="dark"]{--bg:#101A13;--card:#182619;--ink:#EAF3E6;--mut:#9FB3A3;--leaf:#4CC46E;--leaf2:#20402A;--line:#27402D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 4px}
.top{display:flex;align-items:center;gap:10px}
.logo{-webkit-touch-callout:none;font-weight:800;font-size:22px;color:var(--leaf);letter-spacing:-.5px;flex:1;user-select:none}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;position:relative}
.ib b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:9px;min-width:18px;height:18px;line-height:18px}
.search{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
main{padding:6px 14px;touch-action:pan-y}
.slide{animation:sl .22s ease-out}@keyframes sl{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.hero{position:relative;border-radius:22px;padding:22px 20px;min-height:170px;color:#fff;background:linear-gradient(135deg,#1E7A3F,#0F4F2A);overflow:hidden;background-size:cover;background-position:center}
.hero.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.1))}
.hero *{position:relative}
.hero h1{margin:0 0 6px;font-size:28px;line-height:1.05;font-weight:800;max-width:80%}
.hero p{margin:0 0 14px;opacity:.9;max-width:80%}
.hero .tag{display:inline-block;background:var(--sun);color:#3a2600;font-weight:800;padding:8px 14px;border-radius:12px;border:0;font-family:inherit;cursor:pointer}
h2{font-size:18px;margin:20px 0 10px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:13px;color:var(--leaf);font-weight:600;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--leaf2);border-radius:16px;padding:14px 6px;text-align:center;font-weight:600;font-size:13px;cursor:pointer;border:0;color:var(--ink);font-family:inherit}
.cat span{display:block;font-size:30px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.row .p{flex:none;width:148px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column}
.pi{height:96px;border-radius:12px;background:var(--leaf2);display:grid;place-items:center;font-size:52px;overflow:hidden}
.pi img{width:100%;height:100%;object-fit:cover}
.p h3{font-size:14px;margin:8px 0 0;font-weight:600}.p small{color:var(--mut)}
.pb{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pb strong{font-size:15px}
.add{border:1.5px solid var(--leaf);color:var(--leaf);background:transparent;border-radius:10px;padding:6px 14px;font:800 13px inherit;font-family:inherit;cursor:pointer}
.qty{display:flex;align-items:center;background:var(--leaf);color:#fff;border-radius:10px}
.qty button{background:none;border:0;color:#fff;font-size:17px;width:28px;height:30px;cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;width:100%;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 8px;font:600 11px inherit;font-family:inherit;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--leaf)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.li .pi{width:48px;height:48px;font-size:26px;flex:none}.li div.n{flex:1}
input,select{width:100%;padding:10px 12px;margin:4px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{font-size:12px;font-weight:600;color:var(--mut)}
.btn{width:100%;background:var(--leaf);color:#fff;border:0;border-radius:12px;padding:13px;font:800 15px inherit;font-family:inherit;cursor:pointer}

const logoSrc=()=>db.logo||LOGO_DEFAULT;
function logoForm(){return `<h2>🖼️ App logo / cover</h2><div class="box"><small style="display:block;color:var(--mut);margin-bottom:8px">Shown in the header, on the Home page cover and as the app icon.</small><div style="text-align:center;margin-bottom:10px"><img src="${logoSrc()}" alt="Current logo" style="width:96px;height:96px;object-fit:contain;background:#fff;border-radius:50%;padding:8px;border:1px solid var(--line)"></div><label class="btn g fl">🖼️ Choose a new logo<input class="fh" type="file" accept="image/*" id="logof"></label><button class="btn g" data-a="logoreset" style="margin-top:8px">Use the default Green Bites logo</button></div>`}
function home(){const b=db.banner;let h=`${welcomeCard()}<div class="hero ${b.img?"img":""}" ${b.img?`style="background-image:url('${esc(b.img)}')"`:""}><img class="hlogo" src="${logoSrc()}" alt="Green Bites logo"><h1>${esc(b.title)}</h1><p>${esc(b.sub)}</p><button class="tag" data-a="go" data-v="fruit">Shop now</button></div>
${offersBar()}${videoBar()}${exploreBar()}${recentBar()}<h2>Shop by menu</h2><div class="cats">${CATS.map(c=>`<button class="cat" data-a="go" data-v="${c[0]}"><span>${c[2]}</span>${c[1]}${RESTRICTED.includes(c[0])?`<br><small>${ageOf(c[0])}+ only</small>`:""}</button>`).join("")}</div>`;
CATS.forEach(c=>{if(RESTRICTED.includes(c[0]))return;const l=db.products.filter(p=>p.cat===c[0]).slice(0,6);if(l.length)h+=`<h2>${c[1]}<a data-a="go" data-v="${c[0]}">See all</a></h2><div class="row">${l.map(card).join("")}</div>`});return h+homeFoot()}
let sub={};
function subsOf(id){const d=SUBS[id]||[];const ex=[...new Set(db.products.filter(p=>p.cat===id&&p.sub&&!d.some(x=>x[0]===p.sub)).map(p=>p.sub))].map(n=>[n,"🏷️"]);return [...d,...ex]}
